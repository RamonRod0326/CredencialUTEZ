; ============================================================
;  nfc-pn532 — configuración del firmware
; ============================================================
;  Este archivo ES el entorno aislado: placa, framework y la
;  versión exacta de cada librería. Todo clavado (RNF-01) para
;  poder recompilar dentro de un año y que funcione igual.
; ============================================================

[env:esp32dev]
; --- Qué placa es ---
; C-011: ESP32-D0WD-V3 rev 3.1, 4 MB. Confirmado con esptool el 2026-11-25.
board     = esp32dev
platform  = espressif32@7.0.1
framework = arduino

; --- Cómo se comunica con la Mac ---
; ⚠️ El Tamagotchi (C-001) sale con este MISMO puerto. Por eso
; proteger-placa.py comprueba la MAC antes de cada carga.
upload_port     = /dev/cu.usbserial-0001
monitor_port    = /dev/cu.usbserial-0001
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

extra_scripts =
    pre:version.py        ; mete el commit de Git en el firmware
    proteger-placa.py     ; no cargar nunca en la placa equivocada

; --- Librerías (ADR-0002) ---
; Adafruit PN532 1.3.4 NO va aquí: hay una copia con un parche de 2
; líneas en lib/Adafruit_PN532 (ver lib/LEEME.md).
lib_deps =
    adafruit/Adafruit BusIO@1.17.4   ; la usa Adafruit PN532 para hablar SPI
