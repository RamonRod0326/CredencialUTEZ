; ============================================================
;  Prueba 01 — ¿Está bien el cableado I2C del PN532?
; ============================================================
;  Prueba desechable: no usa ninguna librería del PN532, solo
;  el bus I2C. Si esto pasa, los cables están bien y cualquier
;  fallo posterior es de código, no de hardware.
; ============================================================

[env:esp32dev]
board     = esp32dev
; Versión clavada (RNF-01). Es la que ya está descargada en esta
; Mac, así que no hay que bajar nada.
platform  = espressif32@7.0.1
framework = arduino

; ⚠️ El Tamagotchi (C-001) sale con este MISMO puerto.
; Comprobar la MAC antes de cargar: debe ser E0:8C:FE:30:C9:1C.
upload_port   = /dev/cu.usbserial-0001
monitor_port  = /dev/cu.usbserial-0001
monitor_speed = 115200
