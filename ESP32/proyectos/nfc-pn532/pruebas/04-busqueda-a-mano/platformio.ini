; ============================================================
;  Prueba 04 — ¿Qué cuelga al PN532 al buscar tarjetas?
; ============================================================
[env:esp32dev]
board     = esp32dev
platform  = espressif32@7.0.1
framework = arduino

; ⚠️ El Tamagotchi (C-001) sale con este MISMO puerto.
; Comprobar la MAC antes de cargar: debe ser E0:8C:FE:30:C9:1C.
upload_port   = /dev/cu.usbserial-0001
monitor_port  = /dev/cu.usbserial-0001
monitor_speed = 115200
extra_scripts = ../../firmware/proteger-placa.py
