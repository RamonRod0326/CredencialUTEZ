; ============================================================
;  Prueba 07 — Volcar el contenido de etiquetas NFC
; ============================================================
;  Fue el primer firmware del proyecto (2026-11-25): detecta
;  cualquier etiqueta, dice su tipo y vuelca su memoria
;  (MIFARE Classic, Ultralight/NTAG). Se conserva aquí como
;  herramienta de exploración; el firmware principal pasó a ser
;  el lector de credenciales.
; ============================================================
[env:esp32dev]
board     = esp32dev
platform  = espressif32@7.0.1
framework = arduino

upload_port   = /dev/cu.usbserial-0001
monitor_port  = /dev/cu.usbserial-0001
monitor_speed = 115200
extra_scripts = ../../firmware/proteger-placa.py

lib_deps =
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit BusIO@1.17.4
